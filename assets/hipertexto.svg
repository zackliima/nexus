<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="619" viewBox="0 0 1024 619"><rect width="1024" height="619" fill="#f4f1eb"/><g font-family="Georgia,serif" fill="#272332"><text x="60" y="92" font-size="44">Informação que leva a informação.</text><text x="60" y="155" font-size="22">Uma página pode ser o começo de muitos caminhos.</text></g><g font-family="Arial,sans-serif" font-size="22" fill="#635096"><text x="60" y="242" text-decoration="underline">Descobrir uma ideia</text><text x="60" y="333" text-decoration="underline">Seguir uma referência</text><text x="60" y="424" text-decoration="underline">Encontrar outro documento</text></g><g font-family="Arial,sans-serif" font-size="17" fill="#706c77"><text x="60" y="275">Leia, conecte e continue a explorar.</text><text x="60" y="366">O conhecimento não precisa terminar na mesma página.</text><text x="60" y="457">Cada endereço abre uma nova possibilidade.</text></g><path d="M720 230H840V330H765V425H880" fill="none" stroke="#9c88b9" stroke-width="2"/><g fill="#f4f1eb" stroke="#9c88b9" stroke-width="2"><circle cx="720" cy="230" r="12"/><circle cx="840" cy="330" r="12"/><circle cx="880" cy="425" r="12"/></g><path d="M60 530H964" stroke="#d3ccd5"/><text x="60" y="570" font-family="monospace" font-size="14" fill="#7e758b">NEXUS / ESTUDO VISUAL DE HIPERTEXTO / 03</text></svg>